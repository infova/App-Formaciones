<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iDealer Onboarding | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>

<body>
<script>
    // Restaurar tema antes de render (evita flash)
    if (localStorage.getItem('app_theme') === 'light') document.body.classList.add('light-mode');
</script>

    <button class="theme-toggle-btn" onclick="toggleLoginTheme()" id="theme-toggle" title="Cambiar tema">
        <span class="material-icons-round" id="theme-icon" style="font-size:18px">light_mode</span>
    </button>

    <div class="glass-card w-full max-w-md p-8 rounded-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>

        <div class="text-center mb-8">
            <div class="mb-4 flex items-center justify-center">
                <img src="img/logo_horizontal.png" alt="iDealer Onboarding Logo"
                    class="max-w-[340px] w-full h-auto object-contain">
            </div>
            <!-- <h1 class="text-2xl font-bold text-white tracking-tight">Bienvenido</h1>
            <p class="text-slate-400 text-sm mt-1">Inicia sesión para continuar</p> -->
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Usuario</label>
                <input type="text" id="username"
                    class="input-field w-full rounded-lg px-4 py-3 text-sm text-white outline-none" placeholder="admin">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Contraseña</label>
                <input type="password" id="password"
                    class="input-field w-full rounded-lg px-4 py-3 text-sm text-white outline-none"
                    placeholder="••••••••">
            </div>

            <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg shadow-lg hover:shadow-indigo-500/25 transition-all active:scale-95 duration-200 mt-6">
                Entrar
            </button>
        </form>

        <p class="text-center text-[10px] text-slate-600 mt-6 font-bold uppercase tracking-widest">
            • © 2026 iDealer Onboarding • <br>
            Todos los derechos reservados
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const btn = e.target.querySelector('button');

            try {
                btn.innerHTML = '<svg class="animate-spin h-5 w-5 mx-auto text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
                btn.disabled = true;

                const res = await fetch('api/auth.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await res.json();

                if (data.success) {
                    sessionStorage.setItem('idealer_user', JSON.stringify(data.user));
                    setTimeout(() => window.location.href = '/', 500);
                } else {
                    const isLight = document.body.classList.contains('light-mode');
                    Swal.fire({
                        icon: 'error',
                        title: 'Acceso Denegado',
                        text: data.error,
                        background: isLight ? 'rgba(255,255,255,0.94)' : '#1e293b',
                        color: isLight ? '#1e293b' : '#fff',
                        confirmButtonColor: '#4f46e5'
                    });
                    btn.innerHTML = 'Entrar';
                    btn.disabled = false;
                }
            } catch (error) {
                console.error(error);
                btn.innerHTML = 'Entrar';
                btn.disabled = false;
            }
        });

        function toggleLoginTheme() {
            const isLight = document.body.classList.toggle('light-mode');
            document.getElementById('theme-icon').textContent = isLight ? 'dark_mode' : 'light_mode';
            localStorage.setItem('app_theme', isLight ? 'light' : 'dark');
        }

        // Sync icon with restored theme
        if (document.body.classList.contains('light-mode')) {
            document.getElementById('theme-icon').textContent = 'dark_mode';
        }
    </script>
</body>

</html>
